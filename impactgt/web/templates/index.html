<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMPACT GT search</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script defer src="{{ url_for('static', filename='search.js') }}"></script>
</head>
<body>
<main>
<h1>IMPACT GT search</h1>
<form id="search">
<label>Search mode <select id="mode"><option value="words">Words</option><option value="glyphs">Glyphs</option></select></label>
<label>Query <input id="query" value="Aniołem" required></label>
<button>Search</button>
</form>
<p id="hint">Exact indexed word, case-sensitive.</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden>
<div class="toolbar">
<button id="previous">Previous page</button><span id="page"></span><button id="next">Next page</button>
<label>Zoom <input id="zoom" type="range" min="50" max="250" value="100" step="10"></label>
<label><input id="show" type="checkbox" checked> Highlights</label>
</div>
<div id="viewport"><div id="sheet"></div></div>
</section>
</main>
</body>
</html>
